<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>명령어 핸드북</title>
<meta name="description" content="RHEL·Rocky / Ubuntu·Debian / Windows 엔지니어 명령어 핸드북">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="명령어 핸드북">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script>
  try {
    var s = JSON.parse(localStorage.getItem('ch.settings') || '{}');
    var t = s.theme || 'system';
    if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
    if (s.font) document.documentElement.style.setProperty('--code-size', s.font + 'px');
  } catch (e) {}
</script>
</head>
<body>
<div id="app" class="app">
  <main id="view" class="view" tabindex="-1">
    <div class="loading">데이터를 불러오는 중…</div>
  </main>
  <nav class="tabbar" aria-label="하단 메뉴">
    <a href="#/" data-tab="home"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>홈</a>
    <a href="#/search" data-tab="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>검색</a>
    <a href="#/favorites" data-tab="favorites"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>즐겨찾기</a>
    <a href="#/settings" data-tab="settings"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>설정</a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="app.js"></script>
</body>
</html>
